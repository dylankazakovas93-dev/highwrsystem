# NQ primary (pre-registered) configuration — the starting hypothesis, not a tuned result.
# Range window 90m, width 40–100 pts, TP 15 pts inside the box, stop edge+7.5,
# day-move <= 0.5%, flat VWAP, no last hour, max 1 trade/day.

instrument:
  symbol: NQ
  tick_size: 0.25
  point_value: 20.0
  commission_per_side: 2.50
  slippage_ticks: 1

data:
  tz_input: null              # set to "UTC" etc. if your file has naive UTC stamps
  tz_market: America/New_York
  bar_minutes: 1

sessions:
  day_roll_hour: 18
  flat_at_session_end: true
  trade: [asia, london_early, ny_morning, ny_lunch_pm]
  # session definitions inherit code defaults:
  # asia 18:00-02:00, london_early 02:00-05:00, pre_ny 05:00-09:30 (off),
  # ny_morning 09:30-12:00, ny_lunch_pm 12:00-15:00, ny_last_hour 15:00-16:00 (off)

range:
  method: rolling             # rolling | adaptive | session
  window_minutes: 90
  min_width_points: 40.0
  max_width_points: 100.0
  min_window_coverage: 0.8
  formation_session: asia     # only used when method == session
  extremes_min_age_minutes: 30
  max_net_drift_frac: 0.5
  profile_bin_points: 1.0
  value_area: 0.70

filters:
  max_day_move_pct: 0.5
  day_move_refs: [prior_close, rth_open]
  max_range_vs_prior_atr: 0.5
  prior_atr_days: 14
  max_vwap_slope_points: 10.0
  vwap_slope_window_minutes: 30
  vwap_anchor: auto
  min_mid_crossings: 3
  extreme_extension_points: 15.0
  extreme_extension_window_minutes: 30
  rv_window_minutes: 30
  rv_max_vs_median: 2.0
  rv_median_days: 20
  news_file: null             # e.g. data/news.csv (see data/news_template.csv)
  news_block_before_min: 15
  news_block_after_min: 15

entry:
  type: A                     # A reclaim-close market | B retest limit | C micro-swing break
  edge_def: pct               # absolute | pct | vah_val | hybrid
  edge_pct: 0.10
  max_overshoot_points: 10.0
  probe_ttl_bars: 30
  reclaim_bars: 1
  retest_ttl_bars: 15
  retest_level: edge
  confirm_swing_bars: 3
  confirm_ttl_bars: 10
  one_attempt_per_side: true
  max_trades_per_day: 1
  stop_after_daily_loss: true
  min_minutes_to_flat: 15

exit:
  tp_mode: fixed              # fixed | mid | poc | opposite_25
  tp_points: 15.0
  min_tp_points: 15.0
  require_target_inside: true
  target_inside_buffer_points: 0.0
  stop_model: edge_plus       # edge_plus | excursion_plus | range_frac
  stop_buffer_points: 7.5
  stop_range_frac: 0.35
  max_stop_points: 25.0
  stop_cap_mode: clamp
  min_stop_points: 3.0
  invalidate_close_outside: false
  invalidation_buffer_points: 5.0
  max_holding_minutes: 120
  flat_by: "15:00"            # keeps everything out of the last hour

engine:
  both_touch: loss
  tp_fill_through_ticks: 1
  limit_fill_through_ticks: 1
  slippage_scenarios: [0, 1, 2, 3]

prop:
  buffer: 2000.0
  dd_type: trailing_eod       # static | trailing_eod | trailing_intraday
  trailing_caps_at_start: true
  daily_loss_limit: 1000.0
  activation_cost: 165.0
  payout_threshold: 3000.0
  profit_split: 0.90
  min_trading_days: 5
  consistency_max_day_frac: 0.5
  contracts: 1
  max_trading_days: 120
  n_paths: 5000
  resample: shuffle_days      # shuffle_days | bootstrap_days
  seed: 7
  max_attempts: 3
  sens_costs: [100, 165, 300, 500]
  sens_payouts: [1500, 2000, 3000, 4000]
  sens_contracts: [1, 2, 3]

rescue:
  enabled: true
  dd_states: [0.25, 0.5, 0.8]
  baseline_wr: 0.45
  baseline_avg_win: 300.0
  baseline_avg_loss: 350.0
  baseline_trades_per_day: 3

report:
  out_dir: out
  charts: true
