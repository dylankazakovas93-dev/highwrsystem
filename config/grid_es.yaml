# ES sweep — instrument-adjusted axes. Base config = config/es_default.yaml.

mode: ofat
random_samples: 250
max_combos: 2000
seed: 11

dev_start: "2025-01-01"
dev_end: "2026-12-31"
holdouts:
  - {name: "2022_2024", start: "2022-01-01", end: "2024-12-31"}
  - {name: "pre_2022",  start: "2000-01-01", end: "2021-12-31"}

min_trades: 40
low_sample: 80
wr_floor: 0.70
min_segment_trades: 15
top2_share_max: 0.35
slip_eval: 1
slip_stress: 2

axes:
  range.window_minutes: [45, 60, 90, 120, 180]
  range.method: [rolling, adaptive, session]
  range.min_width_points: [12, 16, 20, 25, 30]
  filters.max_day_move_pct: [0.3, 0.4, 0.5, 0.6, 0.75]
  filters.max_range_vs_prior_atr: [0.15, 0.2, 0.25, 0.3, 0.4, 0.5]
  entry.type: [A, B, C]
  entry.edge_def: [absolute, pct, vah_val, hybrid]
  entry.edge_pct: [0.10, 0.15, 0.20]
  exit.tp_points: [4, 5, 6, 8, 10, 12]
  exit.tp_mode: [fixed, mid, poc, opposite_25]
  exit.stop_model: [edge_plus, excursion_plus, range_frac]
  exit.stop_buffer_points: [2, 3, 4]
  sessions.trade:
    - [asia]
    - [london_early]
    - [ny_morning]
    - [ny_lunch_pm]
    - [asia, london_early, ny_morning, ny_lunch_pm]
