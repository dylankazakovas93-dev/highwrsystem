# Stage 2: focused random sweep in the region OFAT + conditional diagnostics flagged:
# shorts-only bias, small-poke failures (overshoot floor/cap), wider stops vs 15pt TP,
# per-session isolation. 250 random combos, same rejection rules as stage 1.

mode: random
random_samples: 250
max_combos: 2000
seed: 23

dev_start: "2025-01-01"
dev_end: "2026-06-07"
holdouts:
  - {name: "2022_2024", start: "2022-01-01", end: "2024-12-31"}
  - {name: "2020_2021", start: "2020-01-01", end: "2021-12-31"}

min_trades: 40
low_sample: 80
wr_floor: 0.70
min_segment_trades: 15
top2_share_max: 0.35
slip_eval: 1
slip_stress: 2

axes:
  sessions.trade:
    - [asia]
    - [london_early]
    - [ny_morning]
    - [ny_lunch_pm]
    - [asia, london_early, ny_morning, ny_lunch_pm]
  entry.sides:
    - [short]
    - [long, short]
  range.method: [rolling, adaptive]
  range.window_minutes: [60, 90, 120]
  range.min_width_points: [40, 50, 60]
  entry.edge_pct: [0.10, 0.15, 0.20]
  entry.max_overshoot_points: [3, 5, 10]
  entry.min_overshoot_points: [0, 0.5, 1.0]
  exit.tp_points: [10, 12.5, 15]
  exit.stop_model: [edge_plus, excursion_plus, range_frac]
  exit.stop_buffer_points: [7.5, 10, 12.5]
  exit.stop_range_frac: [0.3, 0.4, 0.5]
  exit.max_stop_points: [20, 25]
  filters.max_day_move_pct: [0.3, 0.5, 0.75]
  filters.max_range_vs_prior_atr: [0.3, 0.5]
  filters.min_mid_crossings: [2, 3, 6]
  filters.extreme_extension_points: [10, 15, null]
  filters.max_vwap_slope_points: [5, 10, 20]
