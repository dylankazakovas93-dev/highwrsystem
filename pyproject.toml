[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rangefade"
version = "0.1.0"
description = "Consolidation range-rotation fade backtester + prop-firm game simulator for NQ/ES futures"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "PyYAML>=6.0"]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[project.scripts]
rangefade = "rangefade.cli:main"

[tool.setuptools.packages.find]
include = ["rangefade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
